[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cavity-design"
version = "0.1.0"
description = "Calculations to design a stable thin cavity"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.2.6",
    "scipy==1.15.3",
    "matplotlib==3.8.4",
    "pillow==11.2.1",
    "ipywidgets==8.1.2",
    # Pinned: JupyterLab 4.6.x does not render the jupyterlab_widgets 3.0.16
    # frontend extension, so ipywidgets show only their text repr. 4.5.3 is the
    # last known-good version with this widget stack.
    "jupyterlab==4.5.3",
    "pandas==2.2.2",
    "openpyxl==3.1.5",
    "python-dotenv==0.21.1",
    "tqdm==4.67.1",
    "pyperclip",
    "PyQt5==5.15.11",
    # PySide6 is the Qt binding used for matplotlib's interactive backend
    # (%matplotlib qt) in the analysis notebooks. PyQt5's event loop does not
    # integrate cleanly under this ipykernel/IPython stack (frozen "Not
    # Responding" figure window); PySide6 is the pre-migration, known-good binding.
    "PySide6>=6.5",
    "pywin32==311 ; sys_platform == 'win32'",
    "sympy>=1.14.0",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "black==24.4.2",
]

[tool.uv]
# Force the lock to include wheels usable on Windows. Without this, universal
# resolution picks pyqt5-qt5==5.15.19 (Linux/macOS-only wheels) and the install
# fails on win_amd64. Listing the Windows environment makes uv fork the
# resolution and select a Windows-compatible pyqt5-qt5 for this platform.
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.black]
line-length = 120
